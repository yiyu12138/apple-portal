<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="门户管理员设置" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>管理员设置 · 我的服务中心</title>
    <link rel="icon" href="/assets/portal-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/admin.js" defer></script>
  </head>
  <body class="admin-page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <main class="admin-shell">
      <header class="admin-header">
        <a class="back-link" href="/">← 返回门户</a>
        <div class="admin-brand">
          <img src="/assets/portal-mark.svg" alt="" />
          <span>门户设置</span>
        </div>
        <button id="logout-button" class="button button-secondary" type="button" hidden>退出登录</button>
      </header>

      <section id="login-panel" class="auth-panel settings-card" aria-labelledby="login-title">
        <p class="eyebrow">PRIVATE ADMIN</p>
        <h1 id="login-title">管理员登录<span class="hero-dot">.</span></h1>
        <p class="panel-copy">此密码只用于修改门户配置，不是 NAS、WebDAV 或飞牛影视的业务密码。</p>
        <form id="login-form" class="stack-form">
          <label for="login-password">管理员密码</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required />
          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="button button-primary" type="submit">登录设置页</button>
        </form>
      </section>

      <section id="settings-panel" hidden aria-labelledby="settings-title">
        <div class="settings-intro">
          <div>
            <p class="eyebrow">PERSONAL CLOUD</p>
            <h1 id="settings-title">调整你的入口<span class="hero-dot">.</span></h1>
            <p class="panel-copy">只保存门户公开显示的文字、图标和 HTTPS 服务链接。</p>
          </div>
          <span id="save-state" class="status-pill" role="status">未保存</span>
        </div>

        <form id="portal-form" class="settings-card stack-form">
          <div class="card-heading">
            <div><p class="eyebrow">APPEARANCE</p><h2>门户外观</h2></div>
          </div>
          <label for="portal-title">门户标题</label>
          <input id="portal-title" name="title" maxlength="80" required />
          <label for="portal-subtitle">副标题</label>
          <input id="portal-subtitle" name="subtitle" maxlength="160" required />
        </form>

        <section class="settings-card" aria-labelledby="services-title">
          <div class="card-heading">
            <div><p class="eyebrow">SERVICES</p><h2 id="services-title">服务卡片</h2></div>
            <button id="add-service-button" class="button button-secondary" type="button">添加服务</button>
          </div>
          <p class="field-hint">链接仅允许 HTTPS，并限制在 myfu.cn 及其子域名内。</p>
          <div id="services-list" class="admin-services-list"></div>
          <p id="services-error" class="form-error" role="alert" hidden></p>
        </section>

        <section class="settings-card" aria-labelledby="password-title">
          <div class="card-heading">
            <div><p class="eyebrow">SECURITY</p><h2 id="password-title">修改管理员密码</h2></div>
          </div>
          <form id="password-form" class="stack-form">
            <label for="current-password">当前密码</label>
            <input id="current-password" type="password" autocomplete="current-password" minlength="8" required />
            <label for="new-password">新密码</label>
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required />
            <label for="confirm-password">确认新密码</label>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
            <p class="field-hint">至少 8 个字符。修改成功后，当前登录会话会立即失效。</p>
            <p id="password-state" class="form-error" role="alert" hidden></p>
            <button class="button button-secondary" type="submit">更新密码</button>
          </form>
        </section>

        <div class="admin-actions">
          <p id="global-error" class="form-error" role="alert" hidden></p>
          <button id="save-button" class="button button-primary" type="button">保存所有设置</button>
        </div>
      </section>

      <dialog id="service-dialog" class="service-dialog">
        <form id="service-form" class="stack-form" method="dialog">
          <div class="card-heading"><div><p class="eyebrow">SERVICE</p><h2 id="service-dialog-title">添加服务</h2></div></div>
          <input id="service-id" type="hidden" />
          <label for="service-name">名称</label>
          <input id="service-name" maxlength="60" required />
          <label for="service-description">描述</label>
          <input id="service-description" maxlength="160" required />
          <label for="service-href">HTTPS 链接</label>
          <input id="service-href" type="url" maxlength="512" placeholder="https://service.myfu.cn:7999" required />
          <div class="form-grid-two">
            <div class="stack-form"><label for="service-icon">图标</label><select id="service-icon"><option value="storage">存储</option><option value="play">播放</option><option value="folder">文件夹</option><option value="screen">屏幕</option><option value="code">代码</option></select></div>
            <div class="stack-form"><label for="service-tone">颜色</label><select id="service-tone"><option value="blue">蓝色</option><option value="violet">紫色</option><option value="orange">橙色</option><option value="green">绿色</option><option value="slate">石板灰</option></select></div>
          </div>
          <label class="checkbox-label"><input id="service-enabled" type="checkbox" checked /> 在门户中显示</label>
          <p id="service-form-error" class="form-error" role="alert" hidden></p>
          <div class="dialog-actions"><button id="cancel-service-button" class="button button-secondary" type="button">取消</button><button class="button button-primary" type="submit">完成</button></div>
        </form>
      </dialog>
    </main>
  </body>
</html>
